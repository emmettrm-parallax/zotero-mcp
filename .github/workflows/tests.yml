name: Tests

# This workflow runs the full suite against a clean install (the `pdf`
# extra only, no `semantic`). That install has no chromadb, so 14 tests
# fail and 22 more error on collection. fork_test_baseline.txt records
# that known set, in a node id form with no failure message attached.
# scripts/compare_test_baseline.py strips the message pytest 9 appends
# to every FAILED/ERROR line when CI is set, then compares against the
# baseline. The job fails only when a line appears that the baseline
# does not already list.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install the project with the pdf extra
        run: uv sync --extra pdf

      - name: Run the test suite
        run: |
          set +e
          uv run --with pytest --with pytest-timeout --with pytest-asyncio --with pytest-httpserver \
            python -m pytest tests -q -p no:cacheprovider --continue-on-collection-errors \
            --junitxml=report.xml > pytest_output.txt 2>&1
          echo "$?" > pytest_exit_code.txt
          cat pytest_output.txt

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.xml

      - name: Compare against the known-failure baseline
        run: |
          echo "Pytest summary: $(tail -n 1 pytest_output.txt)"
          python3 scripts/compare_test_baseline.py
