name: Tests

# This workflow runs the full suite against a clean install (the `pdf`
# extra only, no `semantic`). That install has no chromadb, so 14 tests
# fail and 22 more error on collection. fork_test_baseline.txt records
# that known set. The job fails only when a FAILED or ERROR line appears
# that the baseline does not already list.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install the project with the pdf extra
        run: uv sync --extra pdf

      - name: Run the test suite
        run: |
          set +e
          uv run --with pytest --with pytest-timeout --with pytest-asyncio --with pytest-httpserver \
            python -m pytest tests -q -p no:cacheprovider --continue-on-collection-errors \
            --junitxml=report.xml > pytest_output.txt 2>&1
          echo "$?" > pytest_exit_code.txt
          cat pytest_output.txt

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.xml

      - name: Compare against the known-failure baseline
        run: |
          python3 - <<'PY'
          import re
          import sys

          BASELINE_PATH = "fork_test_baseline.txt"
          LOG_PATH = "pytest_output.txt"
          EXIT_CODE_PATH = "pytest_exit_code.txt"

          # A FAILED or ERROR line from the short test summary pytest
          # prints at the end of a run. This pattern never matches the
          # "ERROR collecting ..." header pytest prints earlier, in the
          # verbose traceback section.
          LINE_RE = re.compile(r"^(FAILED|ERROR)\s+\S")


          def read_baseline(path):
              with open(path, encoding="utf-8") as f:
                  lines = [line.rstrip("\n") for line in f]
              # Line 1 is a human summary. The rest are known lines.
              return {line for line in lines[1:] if line.strip()}


          def read_observed(path):
              with open(path, encoding="utf-8") as f:
                  text = f.read()
              marker = "short test summary info"
              tail = text.split(marker, 1)[1] if marker in text else text
              return {line.strip() for line in tail.splitlines() if LINE_RE.match(line)}


          def read_exit_code(path):
              with open(path, encoding="utf-8") as f:
                  return int(f.read().strip())


          def main():
              exit_code = read_exit_code(EXIT_CODE_PATH)
              # 0 means every test passed. 1 means some tests failed or
              # errored, the case this gate exists to tolerate. Any other
              # code means pytest did not finish a normal run (it was
              # interrupted, it hit an internal error, or it collected no
              # tests), so the baseline comparison below cannot be trusted.
              if exit_code not in (0, 1):
                  print(f"pytest exited {exit_code}, not a normal pass or fail run.")
                  print("Treating this as a failure. Tail of the log:")
                  with open(LOG_PATH, encoding="utf-8") as f:
                      lines = f.readlines()
                  print("".join(lines[-40:]))
                  sys.exit(1)

              baseline = read_baseline(BASELINE_PATH)
              observed = read_observed(LOG_PATH)

              new_failures = sorted(observed - baseline)
              fixed = sorted(baseline - observed)

              if fixed:
                  print(f"{len(fixed)} known failure(s) no longer reproduce. Update the baseline:")
                  for line in fixed:
                      print(f"  {line}")

              if new_failures:
                  print(f"{len(new_failures)} new failure(s) not in {BASELINE_PATH}:")
                  for line in new_failures:
                      print(f"  {line}")
                  sys.exit(1)

              print(f"No new failures. {len(observed)} known FAILED/ERROR lines observed, {len(baseline)} in the baseline.")


          main()
          PY
